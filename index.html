<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocramFlix +</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --accent: #e50914; 
            --accent-blue: #38bdf8;
            --text: #f8fafc;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navbar Superior */
        .navbar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px 20px 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
        
        .setup-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input[type="file"] { display: none; }
        
        .btn {
            padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; color: white; font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-accent { background: var(--accent); }
        .btn-accent:hover { background: #b80710; }
        .btn-file { background: #1e293b; border: 1px solid #475569; }
        .btn-file:hover { background: #334155; }

        /* Panel de Categorías */
        .categories-section {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }
        .categories-title { font-size: 0.9rem; font-weight: 700; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .categories-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-category {
            background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
            padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s ease; font-weight: 600;
        }
        .btn-category:hover { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }
        .btn-category.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Contenedor Principal */
        .main-container { max-width: 1600px; margin: 0 auto; padding: 10px 20px; }

        /* Sección de Cine */
        .cinema-hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 35px;
            background: linear-gradient(180deg, #151f32 0%, #0b0f19 100%);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #22314d;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        @media (min-width: 1024px) { .cinema-hero { grid-template-columns: 2fr 1.2fr; } }

        .player-box { background: #000; width: 100%; aspect-ratio: 16 / 9; display: block; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Controles Expandidos */
        .player-actions { 
            display: flex; 
            gap: 8px; 
            margin-top: 12px; 
            flex-wrap: wrap;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .select-speed {
            background: #1e293b; color: white; border: 1px solid #475569;
            padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
        }

        .movie-details { padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .movie-title { font-size: 1.8rem; font-weight: 800; margin: 0 0 10px 0; color: #fff; }
        .movie-meta { display: flex; gap: 12px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
        .rating { background: #eab308; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .movie-overview { font-size: 0.95rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 15px; }

        /* Catálogo Grid */
        .catalog-section { margin-top: 10px; }
        .catalog-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; color: #94a3b8; }
        
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        @media (min-width: 650px)  { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 900px)  { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 1200px) { .movie-grid { grid-template-columns: repeat(7, 1fr); } }

        /* Tarjetas */
        .movie-card {
            background: var(--bg-card); border-radius: 6px; overflow: hidden;
            border: 1px solid #22314d; display: flex; flex-direction: column;
            justify-content: flex-start; height: fit-content; transition: border-color 0.2s;
        }
        .movie-card:hover { border-color: var(--accent-blue); }
        
        .poster-wrapper { width: 100%; aspect-ratio: 2 / 3; background: #0f172a; position: relative; cursor: pointer; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .card-info { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 0.8rem; font-weight: 700; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #fff; }
        .card-title:hover { color: var(--accent-blue); }
        .card-year { font-size: 0.75rem; color: #64748b; margin-bottom: 6px; }
        
        /* Desplegable Info */
        .movie-dropdown { border-top: 1px solid #22314d; margin-top: auto; padding-top: 4px; }
        .movie-dropdown summary { font-size: 0.75rem; color: var(--accent-blue); cursor: pointer; outline: none; padding: 2px 0; font-weight: 600; }
        .dropdown-content { background: #0f172a; padding: 6px; border-radius: 4px; margin-top: 4px; max-height: 120px; overflow-y: auto; font-size: 0.75rem; }
        .dropdown-content p { margin: 0 0 6px 0; line-height: 1.3; color: #cbd5e1; }
        .dropdown-content strong { color: #fff; }

        .loading-shimmer { animation: placeholderShimmer 1.5s infinite linear; background: linear-gradient(to right, #1e293b 4%, #334155 25%, #1e293b 36%); background-size: 800px 104px; }
        @keyframes placeholderShimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    </style>
</head>
<body>

    <!-- Input Oculto de la API Key -->
    <input type="hidden" id="tmdbKey">

    <!-- Barra Superior -->
    <div class="navbar">
        <div class="logo">SOCRAM<span style="color:#fff">FLIX +</span></div>
        <div class="setup-panel">
            <label for="fileInput" class="btn btn-file">📂 Archivo Local</label>
            <input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="procesarM3ULocal(event)">
        </div>
    </div>

    <!-- Panel de Categorías -->
    <div class="categories-section">
        <div class="categories-title">Colecciones Disponibles</div>
        <div class="categories-grid" id="categoriesGrid"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <div class="cinema-hero">
            <div style="padding: 10px;">
                <div class="player-box">
                    <!-- Forzamos atributos nativos para asegurar compatibilidad de casteo en navegadores modernos -->
                    <video id="mainVideo" controls autoplay x-webkit-airplay="allow" playsinline picture-in-picture></video>
                </div>
                
                <!-- Barra de controles mejorada -->
                <div class="player-actions">
                    <button class="btn btn-file" onclick="cambiarTiempo(-10)">⏪ -10s</button>
                    <button class="btn btn-file" onclick="cambiarTiempo(10)">⏩ +10s</button>
                    
                    <select class="select-speed" onchange="cambiarVelocidad(this.value)">
                        <option value="1">Velocidad: Normal</option>
                        <option value="1.25">Velocidad: x1.25</option>
                        <option value="1.5">Velocidad: x1.5</option>
                        <option value="2">Velocidad: x2</option>
                    </select>

                    <button class="btn btn-file" onclick="document.getElementById('mainVideo').requestPictureInPicture()">🖼️ Flotante</button>
                    <button class="btn btn-accent" onclick="activarPantallaCompleta()" style="margin-left: auto;">🖥️ Pantalla Completa</button>
                </div>
            </div>
            
            <div class="movie-details" id="currentMovieDetails">
                <h1 class="movie-title" id="mTitle">Bienvenido</h1>
                <div class="movie-meta" id="mMeta"><span>Selecciona una colección arriba o sube un archivo local</span></div>
                <p class="movie-overview" id="mOverview">Haz clic en cualquier categoría para cargar las listas integradas en el servidor de forma instantánea.</p>
                <p class="movie-overview" id="mActors" style="font-size:0.85rem; color:#94a3b8;"></p>
            </div>
        </div>

        <div class="catalog-section">
            <div class="catalog-title">Catálogo Activo (<span id="totalMovies">0</span> ítems)</div>
            <div class="movie-grid" id="catalogGrid"></div>
        </div>
    </div>

<script>
    const LISTAS_INTERNAS = [
        { nombre: "🎨 Pixar", archivo: "Coleccion Pixar.m3u" },
        { nombre: "🌙 DreamWorks", archivo: "Coleccion DreamWorks Animation.m3u" },
        { nombre: "🦇 Universo DC", archivo: "Universo DC.m3u" },
        { font: "🦸 Universo Marvel", nombre: "🦸 Universo Marvel", archivo: "Universo Marvel.m3u" },
        { nombre: "🚓 Sagas Policíacas", archivo: "Sagas Policiacas.m3u" },
        { nombre: "💥 Sagas Acción", archivo: "Sagas Accion.m3u" },
        { nombre: "🏰 Disney", archivo: "Coleccion Disney.m3u" },
        { nombre: "🎵 Musicales", archivo: "Nos va la marcha(Musicales).m3u" },
        { nombre: "🕵️‍♂️ Sagas Suspense", archivo: "Sagas Suspense.m3u" },
        { nombre: "🥋 Artes Marciales", archivo: "Sagas_Artes_Marciales_por_actor.m3u" },
        { nombre: "😂 Sagas Comedia", archivo: "Sagas Comedia.m3u" },
        { nombre: "🟡 Illumination", archivo: "Coleccion Illumination.m3u" },
        { nombre: "❄️ Blue Sky", archivo: "Coleccion Blue Sky.m3u" }
    ];

    const video = document.getElementById('mainVideo');
    const gridUI = document.getElementById('catalogGrid');
    const totalUI = document.getElementById('totalMovies');
    const keyInput = document.getElementById('tmdbKey');
    const categoriesGrid = document.getElementById('categoriesGrid');

    keyInput.value = '8057a54a57714cade319b15e4fc0c3b4';

    let peliculasLista = [];

    // Funciones para la nueva botonera de controles
    function cambiarTiempo(segundos) {
        video.currentTime += segundos;
    }

    function cambiarVelocidad(valor) {
        video.playbackRate = parseFloat(valor);
    }

    function activarPantallaCompleta() {
        if (video.requestFullscreen) {
            video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
            video.webkitRequestFullscreen(); // Safari/iOS
        } else if (video.msRequestFullscreen) {
            video.msRequestFullscreen(); // IE/Edge antiguo
        }
    }

    function inicializarCategorias() {
        categoriesGrid.innerHTML = "";
        LISTAS_INTERNAS.forEach((lista) => {
            const btn = document.createElement('button');
            btn.className = 'btn-category';
            btn.textContent = lista.nombre;
            btn.onclick = () => {
                document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                cargarListaDesdeCarpeta(lista.archivo);
            };
            categoriesGrid.appendChild(btn);
        });
    }

    async function cargarListaDesdeCarpeta(nombreArchivo) {
        gridUI.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--accent-blue); font-weight:bold;">📥 Cargando colección...</div>`;
        totalUI.textContent = "0";

        const urlRelativa = `listas/${encodeURIComponent(nombreArchivo)}`;

        try {
            const response = await fetch(urlRelativa);
            if (!response.ok) throw new Error("Archivo no encontrado");
            
            const textoM3U = await response.text();
            interpretarContenidoM3U(textoM3U);
        } catch (error) {
            gridUI.innerHTML = `
                <div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--accent);">
                    ❌ Error al cargar el archivo m3u.<br>
                    Asegúrate de haber creado la carpeta llamada <strong>listas</strong> al lado de este archivo HTML y que contenga el archivo: <strong>${nombreArchivo}</strong>.
                </div>`;
        }
    }

    function procesarM3ULocal(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
        const reader = new FileReader();
        reader.onload = function(e) {
            interpretarContenidoM3U(e.target.result);
        };
        reader.readAsText(file);
    }

    function interpretarContenidoM3U(texto) {
        const lineas = texto.split(/\r?\n/);
        peliculasLista = [];
        let tituloActual = "";

        for (let i = 0; i < lineas.length; i++) {
            let linea = lineas[i].trim();
            if (linea.startsWith('#EXTINF:')) {
                const idx = linea.lastIndexOf(',');
                tituloActual = idx !== -1 ? linea.substring(idx + 1).trim() : "Película Desconocida";
            } else if (linea && !linea.startsWith('#')) {
                peliculasLista.push({ titulo: tituloActual, url: linea });
                tituloActual = "";
            }
        }
        
        totalUI.textContent = peliculasLista.length;
        construirCatalogoEsqueleto();
        cargarMetadataTMDb();
    }

    function construirCatalogoEsqueleto() {
        gridUI.innerHTML = "";
        peliculasLista.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.id = `movie-card-${index}`;
            card.innerHTML = `
                <div class="poster-wrapper loading-shimmer"></div>
                <div class="card-info">
                    <h4 class="card-title">${item.titulo}</h4>
                    <span class="card-year">Limpiando...</span>
                </div>
            `;
            gridUI.appendChild(card);
        });
    }

    function purificarNombreArchivo(nombreOriginal) {
        let texto = nombreOriginal;
        texto = texto.replace(/\.(mp4|mkv|avi|mov|flv|wmv|mpg|mpeg)$/i, "");
        texto = texto.replace(/[\._\-]/g, " ");

        let anioDetectado = null;
        const matchAnio = texto.match(/\b(19\d\d|20[0-2]\d|2030)\b/);
        if (matchAnio) {
            anioDetectado = matchAnio[0];
            texto = texto.replace(anioDetectado, "");
        }

        const basuraRegex = /\b(1080p|720p|4k|2160p|hd|3d|bluray|brrip|dvdrip|hdrip|webrip|web\s?dl|rip|dual|audio|latino|castellano|espanol|sub|subs|multi|x264|h264|x265|h265|hevc|ac3|dts|xvid|divx|aac)\b/gi;
        texto = texto.replace(basuraRegex, "");
        texto = texto.replace(/[\[\]\(\)]/g, " ");
        texto = texto.replace(/\s+/g, " ").trim();

        return { queryLimpia: texto, anio: anioDetectado };
    }

    async function cargarMetadataTMDb() {
        const api_key = keyInput.value;
        for (let i = 0; i < peliculasLista.length; i++) {
            const p = peliculasLista[i];
            const { queryLimpia, anio } = purificarNombreArchivo(p.titulo);

            try {
                let urlBusqueda = `https://api.themoviedb.org/3/search/movie?api_key=${api_key}&query=${encodeURIComponent(queryLimpia)}&language=es-ES`;
                if (anio) urlBusqueda += `&year=${anio}`;

                const searchRes = await fetch(urlBusqueda);
                const searchData = await searchRes.json();

                if (searchData.results && searchData.results.length > 0) {
                    const idMovie = searchData.results[0].id;
                    const detailRes = await fetch(`https://api.themoviedb.org/3/movie/${idMovie}?api_key=${api_key}&language=es-ES&append_to_response=credits`);
                    const info = await detailRes.json();

                    let reparto = "No disponible";
                    if (info.credits && info.credits.cast) {
                        reparto = info.credits.cast.slice(0, 3).map(actor => actor.name).join(', ');
                    }

                    p.metadata = {
                        tituloEs: info.title,
                        poster: info.poster_path ? `https://image.tmdb.org/t/p/w185${info.poster_path}` : null,
                        sinopsis: info.overview || "Sin descripción disponible.",
                        fecha: info.release_date ? info.release_date.split("-")[0] : "N/A",
                        rating: info.vote_average ? info.vote_average.toFixed(1) : "N/A",
                        actores: reparto
                    };
                } else {
                    if (anio) {
                        const retryRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${api_key}&query=${encodeURIComponent(queryLimpia)}&language=es-ES`);
                        const retryData = await retryRes.json();
                        if (retryData.results && retryData.results.length > 0) {
                            const infoOficial = retryData.results[0];
                            p.metadata = { tituloEs: infoOficial.title, poster: infoOficial.poster_path ? `https://image.tmdb.org/t/p/w185${infoOficial.poster_path}` : null, sinopsis: infoOficial.overview || "Sin descripción.", fecha: infoOficial.release_date ? infoOficial.release_date.split("-")[0] : "N/A", rating: infoOficial.vote_average.toFixed(1), actores: "Desconocido" };
                            actualizarTarjetaUI(i, p);
                            continue;
                        }
                    }
                    p.metadata = obtenerPlaceholder(p.titulo);
                }
            } catch (err) {
                p.metadata = obtenerPlaceholder(p.titulo);
            }
            actualizarTarjetaUI(i, p);
        }
    }

    function obtenerPlaceholder(titulo) {
        let visible = titulo.replace(/\.(mp4|mkv|avi|mov)$/i, "").replace(/[\._\-]/g, " ");
        return { tituloEs: visible, poster: null, sinopsis: "No se encontraron detalles en TMDb.", fecha: "Local", rating: "N/A", actores: "N/A" };
    }

    function actualizarTarjetaUI(index, p) {
        const card = document.getElementById(`movie-card-${index}`);
        if (!card) return;

        const imgHtml = p.metadata.poster 
            ? `<img class="poster-img" src="${p.metadata.poster}" alt="${p.metadata.tituloEs}">`
            : `<div style="display:flex; justify-content:center; align-items:center; height:100%; font-size:0.7rem; color:#64748b; text-align:center; padding:10px; background:#0f172a;">🎬<br>${p.metadata.tituloEs}</div>`;

        card.innerHTML = `
            <div class="poster-wrapper" onclick="reproducirPelicula(${index})">${imgHtml}</div>
            <div class="card-info">
                <h4 class="card-title" onclick="reproducirPelicula(${index})" title="${p.metadata.tituloEs}">${p.metadata.tituloEs}</h4>
                <span class="card-year">${p.metadata.fecha} • ⭐ ${p.metadata.rating}</span>
                
                <details class="movie-dropdown">
                    <summary>Ver Info</summary>
                    <div class="dropdown-content">
                        <p><strong>Reparto:</strong> ${p.metadata.actores}</p>
                        <p><strong>Sinopsis:</strong> ${p.metadata.sinopsis}</p>
                    </div>
                </details>
            </div>
        `;
    }

    function reproducirPelicula(index) {
        const p = peliculasLista[index];
        video.src = p.url;
        video.load();
        video.play();

        document.getElementById('mTitle').textContent = p.metadata.tituloEs;
        document.getElementById('mOverview').textContent = p.metadata.sinopsis;
        document.getElementById('mActors').innerHTML = `<strong>Actores Principales:</strong> ${p.metadata.actores}`;
        document.getElementById('mMeta').innerHTML = `
            <span class="rating">⭐ ${p.metadata.rating}</span>
            <span>📅 Año: ${p.metadata.fecha}</span>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    inicializarCategorias();
</script>
</body>
</html>
